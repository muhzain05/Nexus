name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Validate and test the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      # The version NEXUS is tested against (see mod/nexus/docs/compatibility.md). The mod API is early access.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.318
      - name: Validate the plugin manifest
        run: claude plugin validate mod/nexus
      - name: Validate the marketplace manifests
        run: |
          claude plugin validate .
          claude plugin validate mod
      # Each test file runs in its own process that compiles the plugin, with a 5 s limit per test; a loaded
      # runner can time out the first test of a file. One retry, with the first failure printed; two failures fail.
      - name: Run every test
        run: |
          if ! claude plugin test mod/nexus; then
            echo "::warning::first attempt failed; retrying once (cold-start timing, see CONTRIBUTING.md)"
            claude plugin test mod/nexus
          fi

  config:
    name: Config and docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Versions agree, JSON parses, relative links resolve
        run: python3 .github/scripts/check_repo.py

  secrets:
    name: Secret scan (the commits in this change)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
